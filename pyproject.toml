[build-system]
requires = ["setuptools>=77", "huggingface-hub>=1.33,<2", "filelock>=3.16,<4"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "securevibebench"
version = "0.3.0"
description = "Generate and evaluate secure coding agents on SecureVibeBench"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "docs/THIRD_PARTY_NOTICES.md"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "harbor==0.25.0",
    "tomli-w>=1.2,<2",
    "huggingface-hub>=1.33,<2",
    "filelock>=3.16,<4",
]

[dependency-groups]
dev = ["build>=1.2.2", "twine>=6.0", "pytest>=8,<10"]

[project.scripts]
securevibebench = "securevibebench_evaluation.cli:main"

[project.urls]
Homepage = "https://github.com/iCSawyer/SecureVibeBench"
Documentation = "https://github.com/iCSawyer/SecureVibeBench/blob/main/docs/README.md"
Issues = "https://github.com/iCSawyer/SecureVibeBench/issues"
Dataset = "https://huggingface.co/datasets/iCSawyer/SecureVibeBench"

[tool.setuptools]
packages = ["securevibebench_evaluation"]
include-package-data = false

[tool.setuptools.package-dir]
securevibebench_evaluation = "evaluation"

[tool.setuptools.package-data]
securevibebench_evaluation = ["dataset-lock.json", "harbor_assets/*.py", "framework/lock.json", "bundled/tasks.tar.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]

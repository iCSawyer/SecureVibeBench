name: Package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build --sdist
      - run: python -m twine check dist/*.tar.gz
      - name: Install source distribution and test outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/svb-install"
          "$RUNNER_TEMP/svb-install/bin/python" -m pip install dist/*.tar.gz
          cp -R tests "$RUNNER_TEMP/svb-package-tests"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/svb-install/bin/securevibebench" --help
          "$RUNNER_TEMP/svb-install/bin/securevibebench" eval --help
          "$RUNNER_TEMP/svb-install/bin/python" -m unittest discover -s svb-package-tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*.tar.gz

  publish:
    # Runs only for version tags such as v0.2.1, after the distribution job passes.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: distribution
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing; no API token is stored on GitHub.
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "Tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
